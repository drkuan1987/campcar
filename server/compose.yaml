services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campcar
      POSTGRES_USER: campcar
      POSTGRES_PASSWORD: campcar_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - campcar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campcar -d campcar"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  campcar_pgdata:
